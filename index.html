<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>map2exif</title>
  </head>
  <body>
    <div id="app">
      <header class="app-header">
        <div class="brand">
          <span class="logo-mark" aria-hidden="true"></span>
          <span class="brand-name">map2exif</span>
        </div>
        <p class="tagline">Add EXIF location data to photos taken before devices had GPS.</p>
      </header>

      <main class="layout">
        <section class="section map-panel">
          <h2>Step 1 &middot; Pick a location</h2>
          <div class="map-card">
            <div id="map"></div>

            <div class="map-search">
              <div class="search-pill">
                <svg class="search-icon" width="15" height="15" viewBox="0 0 24 24" aria-hidden="true">
                  <circle cx="10" cy="10" r="7" fill="none" stroke="currentColor" stroke-width="2"></circle>
                  <line x1="15.5" y1="15.5" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"></line>
                </svg>
                <input id="search-input" type="text" placeholder="Search an address or place&hellip;" autocomplete="off" />
                <button id="search-button" type="button">Search</button>
              </div>
            </div>

            <p id="selected-location" class="selected-location">No location selected &mdash; click the map.</p>
          </div>
        </section>

        <section class="section upload-panel">
          <div class="section-header-row">
            <h2>Step 2 &middot; Upload photos</h2>
            <span id="photo-count" class="photo-count">None yet</span>
          </div>
          <div id="dropzone" class="photo-strip">
            <label class="file-picker-tile">
              <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true">
                <rect x="3" y="3" width="18" height="18" rx="3" fill="none" stroke="currentColor" stroke-width="1.6"></rect>
                <circle cx="9" cy="9" r="1.6" fill="currentColor"></circle>
                <path d="M4 17l5-5 4 4 3-3 4 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path>
              </svg>
              <span>Drop JPEGs<br />or browse</span>
              <input id="file-input" type="file" accept="image/jpeg" multiple />
            </label>
            <ul id="thumbnail-list" class="thumbnail-list"></ul>
          </div>
        </section>
      </main>

      <footer class="action-footer">
        <button id="apply-button" type="button" disabled>Apply location to 0 photo(s)</button>
        <button id="download-zip-button" type="button" disabled>Download all as ZIP</button>
        <span id="status-message" class="status-message"></span>
        <span class="privacy-note">Everything happens in your browser &mdash; photos are never uploaded.</span>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
